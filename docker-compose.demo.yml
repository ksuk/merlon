# Local demo topology (synthetic data, auth disabled). Do NOT expose publicly.
#
# `docker compose -f docker-compose.demo.yml up --build` starts a self-contained
# db + api stack pre-loaded with synthetic seed data at http://127.0.0.1:8080.
# No environment variables are required to start it. This topology is for
# local evaluation only: authentication is disabled and only synthetic
# screening lists are mounted. Never run this compose file on a
# publicly reachable host.

services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: merlon
      POSTGRES_USER: merlon
      POSTGRES_PASSWORD: ${MERLON_POSTGRES_PASSWORD:-merlon-demo-local}
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merlon -d merlon"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      # The "demo" target is the standard runtime image plus a generated
      # deploy/seed/demo/*.json-equivalent dataset baked in at
      # /app/demo-data (api/Dockerfile); it adds no env vars or binaries
      # beyond that. See api/internal/seed's JSON loader (PH7 T2) for how
      # MERLON_DEMO_DATA_DIR below is consumed.
      target: demo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MERLON_ENV: development
      MERLON_HTTP_ADDR: ":8080"
      MERLON_DATABASE_URL: postgres://merlon:${MERLON_POSTGRES_PASSWORD:-merlon-demo-local}@db:5432/merlon?sslmode=disable
      MERLON_AUTH_ENABLED: "false"
      MERLON_SEED: "true"
      # demogen's dataset primary IDs are deterministic UUIDv5 values
      # derived from a human-readable generation-time label (see
      # api/internal/demogen/ids.go's uuidFor and remap.go), so they satisfy
      # customers/transactions/alerts/accounts/rule_definitions/
      # customer_score_history's UUID primary key columns (migrations/001,
      # 002, 004, 011, 020). deploy/seed/demo/STORY_IDS.md documents the
      # label/UUID mapping for the demo tour's fixed story IDs; regenerating
      # (`make demogen`) reproduces the same UUIDs every time. Confirmed end-
      # to-end against a real PostgreSQL 16 instance (customers/transactions/
      # alerts/accounts/rule_definitions/score_history/cases/case_notes/
      # screening_results/audit_logs all load; the fixed story-04 customer/
      # alert/case UUIDs resolve via the HTTP API) during PH7 T2.
      MERLON_DEMO_DATA_DIR: /app/demo-data
      MERLON_UI_DIR: /app/ui
      MERLON_LOG_LEVEL: info
      # Sample rule content (CDD weights, TM scenarios, country risk) so the
      # native engine activates; see content/README.md for the schema.
      # NOTE: content/_sample/cdd_basic_weights.yaml uses the legacy `axes:`
      # layout and is rejected by the native engine ("CDD risk_factors must
      # not be empty"). funds_transfer.yaml (current `risk_factors:` schema)
      # is the preset the demo dataset (merlon-demogen) is scored against, so
      # a live re-score in the UI reproduces the same value recorded at
      # generation time; crypto_exchange.yaml was an earlier stand-in whose
      # unresolved product_channel/transaction_pattern factors pinned every
      # individual/JP customer to medium (score 2.647) regardless of
      # attributes, which funds_transfer.yaml's factor design fixes.
      MERLON_CDD_WEIGHTS_PATH: /app/content/_sample/cdd_weights/funds_transfer.yaml
      MERLON_TM_SCENARIOS_PATH: /app/content/_sample/tm_scenarios
      MERLON_COUNTRY_RISK_PATH: /app/content/_sample/country_risk_sample.yaml
      # Synthetic-only screening lists (see deploy/seed/demo/screening_lists/README.md).
      # Deliberately NOT content/_sample/screening_lists: this demo must only
      # ever load fully synthetic DEMO- prefixed records (DD3).
      MERLON_SCREENING_LISTS_PATH: /app/screening_lists
    volumes:
      - ./content:/app/content:ro
      - ./deploy/seed/demo/screening_lists:/app/screening_lists:ro
    healthcheck:
      # api/Dockerfile's runtime image is alpine with no curl; busybox wget
      # (already present in the alpine base) is used instead.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  demo_pgdata:
