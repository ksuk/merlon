# Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      target: builder
    volumes:
      - ./api:/build
    environment:
      MERLON_ENV: development
      MERLON_LOG_LEVEL: debug

  engine:
    volumes:
      - ./engine:/build/engine
      - ./proto:/build/proto
      - ./content/_sample/cdd_weights:/app/cdd_weights:ro
      - ./content/_sample/tm_scenarios:/app/tm_scenarios:ro
      - ./content/_sample/screening_lists:/app/screening_lists:ro
