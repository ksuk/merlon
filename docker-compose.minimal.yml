services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merlon
      POSTGRES_USER: merlon
      POSTGRES_PASSWORD: merlon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merlon -d merlon"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MERLON_ENV: development
      MERLON_HTTP_ADDR: ":8080"
      MERLON_DATABASE_URL: postgres://merlon:merlon@db:5432/merlon?sslmode=disable
      MERLON_UI_DIR: /app/ui
      MERLON_SEED: "true"
      MERLON_LOG_LEVEL: info
    # engine is not included in the minimal profile.
    # Use docker-compose.yml for the full topology.

volumes:
  pgdata:
