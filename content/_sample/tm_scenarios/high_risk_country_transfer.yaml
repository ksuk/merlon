# tm_scenario_v2 (the rule schema §1). WS-5 Task8: outbound transfer to a
# high-risk country, above a threshold amount. high_risk_countries is a
# scenario-local parameter for this WS; WS-2's independent
# country_risk_table content can replace it later without changing the
# engine-side evaluate logic (01_gap-analysis.md, scope note in
# ws05-tm-enhancement.md Task 8).
schema_version: "2.0"
scenario_id: tm_high_risk_country_transfer
name: "ハイリスク国送金検知"
description: "ハイリスク国への送金を検知する"
type: aggregation
conditions:
  transaction_type:
    - transfer_out
  threshold:
    by_customer_type:
      individual:
        by_risk_tier:
          LOW: 3000000
          MEDIUM: 2000000
          HIGH: 1000000
      corporate_domestic:
        by_risk_tier:
          LOW: 3000000
          MEDIUM: 2000000
          HIGH: 1000000
      corporate_foreign:
        by_risk_tier:
          LOW: 3000000
          MEDIUM: 2000000
          HIGH: 1000000
  additional:
    threshold_amount: 1000000
    high_risk_countries:
      - KP
      - IR
      - SY
      - CU
      - MM
evaluation_mode: realtime
severity: HIGH
tags:
  - sanctions
  - sample
