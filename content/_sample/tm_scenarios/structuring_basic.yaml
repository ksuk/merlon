# tm_scenario_v2 (the rule schema §1). Semantically equivalent to the v1
# fixture at content/_sample/tm_scenarios_v1_compat/structuring_basic.yaml:
# v1 had no customer_type dimension, so the same per-risk-tier threshold is
# repeated for every customer_type here (the rule schema §3.1 migration item 2).
schema_version: "2.1"
scenario_id: tm_structuring_basic
detector: structuring
name: "ストラクチャリング検知（基本）"
description: "報告閾値を回避するための取引分割を検知する"
type: aggregation
conditions:
  transaction_type:
    - deposit
    - transfer_in
  aggregation:
    field: amount
    function: sum
    period: 24h
    group_by: customer_id
  threshold:
    by_customer_type:
      individual:
        by_risk_tier:
          LOW: 2000000
          MEDIUM: 1000000
          HIGH: 500000
      corporate_domestic:
        by_risk_tier:
          LOW: 2000000
          MEDIUM: 1000000
          HIGH: 500000
      corporate_foreign:
        by_risk_tier:
          LOW: 2000000
          MEDIUM: 1000000
          HIGH: 500000
  additional:
    min_transaction_count: 3
    individual_below: 500000
evaluation_mode: both
severity: HIGH
tags:
  - structuring
  - sample
