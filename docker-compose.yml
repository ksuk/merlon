# Standard topology: db + redis + engine + api + ui
# For minimal (PostgreSQL + API only), use docker-compose.minimal.yml

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merlon
      POSTGRES_USER: merlon
      POSTGRES_PASSWORD: merlon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merlon -d merlon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    # M1.1: engine runs as a standalone stub.
    # gRPC communication with api will be wired in M1.3.

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MERLON_ENV: development
      MERLON_HTTP_ADDR: ":8080"
      MERLON_DATABASE_URL: postgres://merlon:merlon@db:5432/merlon?sslmode=disable
      MERLON_CACHE_BACKEND: redis
      MERLON_LOG_LEVEL: info

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
