# Standard topology: PostgreSQL + API. This is the default entry point, so
# `docker compose up --build` needs no -f flag. Overlays:
#   docker-compose.dev.yml   development (run from source, bind-mounted)
#   docker-compose.demo.yml  synthetic demo dataset, authentication disabled
# See docs/operations/deployment.md for production.

services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: merlon
      POSTGRES_USER: merlon
      POSTGRES_PASSWORD: ${MERLON_POSTGRES_PASSWORD:?set MERLON_POSTGRES_PASSWORD}
    volumes:
      # 18+ stores data in a major-version subdirectory of /var/lib/postgresql
      # and rejects a mount at the old /var/lib/postgresql/data path outright.
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merlon -d merlon"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MERLON_API_HOST_PORT:-8080}:8080"
    environment:
      MERLON_ENV: ${MERLON_ENV:-development}
      MERLON_HTTP_ADDR: ":8080"
      MERLON_DATABASE_URL: postgres://merlon:${MERLON_POSTGRES_PASSWORD:?set MERLON_POSTGRES_PASSWORD}@db:5432/merlon?sslmode=disable
      MERLON_AUTH_ENABLED: "true"
      MERLON_BOOTSTRAP_TOKEN: ${MERLON_BOOTSTRAP_TOKEN:?set MERLON_BOOTSTRAP_TOKEN}
      MERLON_JWT_SECRET: ${MERLON_JWT_SECRET:?set MERLON_JWT_SECRET}
      MERLON_UI_DIR: /app/ui
      MERLON_SEED: ${MERLON_SEED:-false}
      # Standard deployments must not silently run without the native engine.
      # Put reviewed operator content under ./operator-content before relying
      # on monitoring; until then /healthz/ready reports engine=error.
      MERLON_ENGINE_REQUIRED: "true"
      MERLON_CDD_WEIGHTS_PATH: /app/operator-content/cdd_weights.yaml
      MERLON_TM_SCENARIOS_PATH: /app/operator-content/tm_scenarios
      MERLON_SCREENING_LISTS_PATH: /app/operator-content/screening_lists
      MERLON_LOG_LEVEL: info
    volumes:
      - ${MERLON_OPERATOR_CONTENT_PATH:-./operator-content}:/app/operator-content:ro
    healthcheck:
      # Orchestration must not call a policy-less API healthy. The process
      # remains reachable through /healthz/live for setup and diagnostics.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
