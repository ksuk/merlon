# Merlon Configuration
# See docs/configuration.md for detailed documentation.

server:
  public_base_url: http://localhost:8080

security:
  require_tls: false
  password_policy:
    min_length: 12

adapters:
  outbound_allowlist: []
  block_private_ip_ranges: true

scoring:
  default_rule_set: cdd_basic_weights

features:
  enterprise_enabled: false
