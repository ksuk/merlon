syntax = "proto3";

package merlon.v1;

option go_package = "github.com/merlon-aml/merlon/api/gen/merlon/v1;merlonv1";

import "merlon/v1/types.proto";
import "merlon/v1/monitoring.proto";

service BacktestService {
  rpc RunBacktest(RunBacktestRequest) returns (RunBacktestResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc Health(HealthRequest) returns (HealthResponse);
}

message BacktestTransaction {
  string transaction_id = 1;
  string customer_id = 2;
  double amount = 3;
  string currency = 4;
  string counterparty_id = 5;
  string counterparty_country = 6;
  TransactionDirection direction = 7;
  Timestamp executed_at = 8;
  string channel = 9;
}

message BacktestCustomer {
  string customer_id = 1;
  CustomerType customer_type = 2;
  string country_code = 3;
  repeated string product_types = 4;
  RiskTier risk_tier = 5;
}

message RunBacktestRequest {
  repeated BacktestCustomer customers = 1;
  repeated BacktestTransaction transactions = 2;
  repeated string scenario_ids = 3;
  string description = 4;
}

message ScenarioResult {
  string scenario_id = 1;
  int32 alerts_generated = 2;
  int32 high_severity_count = 3;
  int32 medium_severity_count = 4;
  int32 low_severity_count = 5;
  repeated string affected_customer_ids = 6;
}

message RunBacktestResponse {
  string backtest_id = 1;
  int32 total_transactions = 2;
  int32 total_customers = 3;
  int32 total_alerts = 4;
  repeated ScenarioResult scenario_results = 5;
  double execution_time_ms = 6;
}
