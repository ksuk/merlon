syntax = "proto3";

package merlon.v1;

option go_package = "github.com/merlon-aml/merlon/api/gen/merlon/v1;merlonv1";

enum RiskTier {
  RISK_TIER_UNSPECIFIED = 0;
  RISK_TIER_LOW = 1;
  RISK_TIER_MEDIUM = 2;
  RISK_TIER_HIGH = 3;
}

enum CustomerType {
  CUSTOMER_TYPE_UNSPECIFIED = 0;
  CUSTOMER_TYPE_INDIVIDUAL = 1;
  CUSTOMER_TYPE_CORPORATE_DOMESTIC = 2;
  CUSTOMER_TYPE_CORPORATE_FOREIGN = 3;
  // Non-natural-person types added by WS-11 Task 3 (data-model.md §1.1.1).
  CUSTOMER_TYPE_TRUST = 4;
  CUSTOMER_TYPE_PARTNERSHIP = 5;
  CUSTOMER_TYPE_NPO = 6;
  CUSTOMER_TYPE_GOVERNMENT = 7;
  CUSTOMER_TYPE_FOREIGN_LEGAL_ARRANGEMENT = 8;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message CustomerAttributes {
  string customer_id = 1;
  CustomerType customer_type = 2;
  string country_code = 3;
  repeated string product_types = 4;
}

message RiskFactor {
  string name = 1;
  string axis = 2;
  double score = 3;
  string description = 4;
}

message HealthStatus {
  string status = 1;
  string version = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
}
