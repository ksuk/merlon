# Generates a machine-readable description of the proto API (pseudomuto-doc's
# "json" template) into docs/api/proto/reference.json. The raw "markdown"
# template output is HTML-anchor-heavy (<a name=...>, <p align=...>) and MDX
# v3 chokes rendering it cleanly inside Docusaurus, so
# website/scripts/generate-proto-docs.mjs renders this JSON into clean,
# MDX-safe, per-file Markdown pages instead (see that script for details).
# Run: cd proto && buf generate --template buf.gen.docs.yaml
version: v2
plugins:
  - remote: buf.build/community/pseudomuto-doc
    out: ../docs/api/proto
    opt: json,reference.json
