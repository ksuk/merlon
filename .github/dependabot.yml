# Dependabot version-update policy.
#
# Routine updates are deliberately consolidated into three monthly review
# lanes. Dependabot security updates remain enabled separately in repository
# settings and are not delayed by these schedules or cooldowns.
version: 2

multi-ecosystem-groups:
  application:
    schedule:
      interval: cron
      cronjob: "0 9 1 * *"
      timezone: "Asia/Tokyo"

  infrastructure:
    schedule:
      interval: cron
      cronjob: "0 9 15 * *"
      timezone: "Asia/Tokyo"

updates:
  # Application lane: Go API and operator UI, one consolidated PR per month.
  - package-ecosystem: gomod
    directory: /api
    patterns: ["*"]
    multi-ecosystem-group: application
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: npm
    directory: /ui
    patterns: ["*"]
    multi-ecosystem-group: application
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7

  # Documentation lane: kept separate so docs-only breakage does not block
  # application dependency maintenance.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: cron
      cronjob: "0 9 8 * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      documentation:
        applies-to: version-updates
        patterns: ["*"]

  # Infrastructure lane: workflow actions, build/runtime images, Compose
  # services, and development-container features move together.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: docker
    directories:
      - /api
      - /ui
      - /.devcontainer
      - /.github/workflows
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    patterns: ["*"]
    multi-ecosystem-group: infrastructure
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
