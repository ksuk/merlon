# Dependabot version-update policy.
#
# Routine updates are organized into three monthly review lanes. Dependabot
# security updates remain enabled separately in repository settings and are
# not delayed by these schedules or cooldowns.
version: 2

updates:
  # Application lane: Go API and operator UI.
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: monthly
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      application:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      application:
        applies-to: version-updates
        patterns: ["*"]

  # Documentation lane: kept separate so docs-only breakage does not block
  # application dependency maintenance.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
      semver-major-days: 60
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      documentation:
        applies-to: version-updates
        patterns: ["*"]

  # Infrastructure lane: workflow actions, build/runtime images, Compose
  # services, and development-container features.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      infrastructure:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /api
      - /ui
      - /.devcontainer
      - /.github/workflows
    schedule:
      interval: monthly
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    ignore:
      # nginx numbers even minor series as stable and odd ones as mainline, so
      # a bump like 1.30.4 -> 1.31.2 moves ui/Dockerfile from the stable branch
      # to the development branch rather than forward within it. Only stable
      # patches are adopted, so minor and major proposals are dropped here
      # instead of being re-argued on every mainline release. Stable security
      # fixes are backported within the tracked series and arrive as patches,
      # so they are unaffected by this rule. Remove this entry deliberately
      # when moving to the 1.32 stable series.
      - dependency-name: "nginx"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      infrastructure:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      infrastructure:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: monthly
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      infrastructure:
        applies-to: version-updates
        patterns: ["*"]
