name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'proto/**'
      - 'api/**'
      - 'content/schema/**'
      - 'scripts/**'
      - 'website/**'
      - 'Makefile'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'proto/**'
      - 'api/**'
      - 'content/schema/**'
      - 'scripts/**'
      - 'website/**'
      - 'Makefile'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}

jobs:
  build:
    name: Build & Check Docs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          setup_only: true

      - name: Docs checks
        run: node website/scripts/checks/run-all.mjs

      - name: Generate protobuf code
        run: make proto

      - name: Generate OpenAPI spec
        run: make generate-openapi

      - name: Generate proto reference docs
        run: make generate-proto-docs

      - name: Build docs site
        run: |
          cd website
          npm ci
          npm run typecheck
          npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-build
          path: website/build

  deploy:
    name: Deploy Docs Site
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docs-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-build
          path: website/build
      - name: Validate production URL
        run: test -n "$DOCS_SITE_URL"
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.110.0'
          workingDirectory: website
          command: deploy --message "Docs ${{ github.sha }}"
      - name: Smoke test deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          base_url="${DEPLOYMENT_URL%/}"
          en_body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$base_url/docs/getting-started")"
          grep -qi '<html' <<<"$en_body"
          ja_body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$base_url/ja/docs/getting-started")"
          grep -qi '<html' <<<"$ja_body"
