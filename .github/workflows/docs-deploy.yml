name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'api/**'
      - 'content/schema/**'
      - 'scripts/**'
      - 'website/**'
      - 'Makefile'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'api/**'
      - 'content/schema/**'
      - 'scripts/**'
      - 'website/**'
      - 'Makefile'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}

jobs:
  build:
    name: Build & Check Docs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Docs checks
        run: node website/scripts/checks/run-all.mjs

      - name: Generate OpenAPI spec
        run: make generate-openapi

      - name: Build docs site
        run: |
          cd website
          npm ci
          npm run test:scripts
          npm run typecheck
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build
          path: website/build

  deploy:
    name: Deploy Docs Site
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docs-production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-build
          path: website/build
      - name: Validate production URL
        run: test -n "$DOCS_SITE_URL"
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Kept identical to website/package.json's wrangler dependency;
          # scripts/check-wrangler-pin.sh enforces it.
          wranglerVersion: '4.114.0'
          workingDirectory: website
          command: deploy --message "Docs ${{ github.sha }}"
      - name: Smoke test deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          base_url="${DEPLOYMENT_URL%/}"
          en_body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$base_url/docs/getting-started")"
          grep -qi '<html' <<<"$en_body"
          ja_body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$base_url/ja/docs/getting-started")"
          grep -qi '<html' <<<"$ja_body"
