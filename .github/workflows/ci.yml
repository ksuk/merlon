name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.12'
      - run: make verify-go GO_TEST_FLAGS='-coverprofile=coverage.out -covermode=atomic'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: api/coverage.out

  scripts-test:
    name: Reference Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      # No setup-python step: the tests are standard library only and run on
      # the runner's preinstalled python3, matching how an operator runs the
      # migration script itself.
      - run: make test-scripts

  ui-build:
    name: UI Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test -- --run --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-coverage
          path: ui/coverage

  postgres-integration:
    name: PostgreSQL Migration & Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: merlon
          POSTGRES_USER: merlon
          POSTGRES_PASSWORD: merlon-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merlon -d merlon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MERLON_DATABASE_URL: postgres://merlon:merlon-ci@localhost:5432/merlon?sslmode=disable
      MERLON_MIGRATION_DATABASE_URL: postgres://merlon:merlon-ci@localhost:5432/merlon?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.12'
      - run: make test-integration

  release-dry-run:
    name: Release Image Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Verify synchronized container pins
        run: make verify-container-pins
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build release image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          push: false
          build-args: VERSION=ci-${{ github.sha }}

  required:
    # Branch protection matches required status checks by check-run name, and a
    # check-run is named after its job. Every workflow that gates main needs a
    # distinct aggregate name, or the contexts collide and none can be required.
    name: CI Required
    if: ${{ always() }}
    needs: [go-test, scripts-test, ui-build, postgres-integration, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          GO_RESULT: ${{ needs.go-test.result }}
          SCRIPTS_RESULT: ${{ needs.scripts-test.result }}
          UI_RESULT: ${{ needs.ui-build.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          RELEASE_RESULT: ${{ needs.release-dry-run.result }}
        run: >-
          test "$GO_RESULT" = success
          -a "$SCRIPTS_RESULT" = success
          -a "$UI_RESULT" = success
          -a "$POSTGRES_RESULT" = success
          -a "$RELEASE_RESULT" = success
