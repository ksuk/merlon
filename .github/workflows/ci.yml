name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - run: make verify-go GO_TEST_FLAGS='-coverprofile=coverage.out -covermode=atomic'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: api/coverage.out

  scripts-test:
    name: Reference Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No setup-python step: the tests are standard library only and run on
      # the runner's preinstalled python3, matching how an operator runs the
      # migration script itself.
      #
      # Node is pinned rather than taken from the runner image because
      # scripts/changelog.mjs gates every release, and check-toolchain-pins.sh
      # holds this version to the same one the other jobs and the image build
      # use. No `npm ci`: the script tests are node: built-ins only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
      - run: make test-scripts

  ui-build:
    name: UI Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test -- --run --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-coverage
          path: ui/coverage

  postgres-integration:
    name: PostgreSQL Migration & Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: merlon
          POSTGRES_USER: merlon
          POSTGRES_PASSWORD: merlon-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merlon -d merlon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MERLON_DATABASE_URL: postgres://merlon:merlon-ci@localhost:5432/merlon?sslmode=disable
      MERLON_MIGRATION_DATABASE_URL: postgres://merlon:merlon-ci@localhost:5432/merlon?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - run: make test-integration
      # MERLON_REQUIRE_... is what stops this step from passing vacuously: with
      # only the RUN flag, a runner without Docker or a typo in the variable
      # name skips every test and still exits 0, turning the entire backup and
      # restore surface green while exercising nothing.
      - name: Exercise PostgreSQL operational scripts
        env:
          MERLON_RUN_POSTGRES_OPERATIONS_INTEGRATION: '1'
          MERLON_REQUIRE_POSTGRES_OPERATIONS_INTEGRATION: '1'
        run: python3 -m unittest -v scripts.test_postgres_operations

  release-dry-run:
    name: Release Image Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # OpenAPI coverage verifies a freshly generated document, so this job
      # needs the same pinned Go toolchain as the Go verification job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Verify synchronized container pins
        run: make verify-container-pins
      # Kept beside the container pins so every "same version declared twice"
      # guard runs under one required check.
      - name: Verify synchronized Wrangler pin
        run: make verify-wrangler-pin
      # This job builds api/Dockerfile below, which proves the image builds with
      # the pinned toolchain but not that anything was tested with it. The other
      # CI jobs supply that, on the versions in the workflows. This step is what
      # keeps those two sets of versions the same.
      - name: Verify synchronized toolchain pins
        run: make verify-toolchain-pins
      # Same "declared twice must agree" rule, applied to configuration: a
      # variable the code reads but nobody documented, or one operators are
      # told to set that nothing reads.
      - name: Verify synchronized environment variables
        run: make verify-env-vars
      # The drift workflow that compares .github/rulesets/ against the live
      # configuration runs weekly and never sees a pull request, so it cannot
      # catch a degraded baseline on the way in. This offline check does: it
      # fails if a committed baseline is missing a field the comparison depends
      # on — bypass_actors above all — or is not in canonical export form.
      #
      # That combination is what turns a noisy failure into a silent one. A
      # token without write access to the ruleset exports it with bypass_actors
      # omitted; committing that to make the drift job green would leave a
      # baseline structurally unable to show a bypass actor being added, and
      # the job would report a match forever. Catching it here means the
      # attempt has to be deliberate rather than expedient.
      - name: Verify ruleset baseline completeness
        run: make verify-ruleset-baseline
      # The OpenAPI document is the contract the project promises to keep
      # compatible. A route registered but never published is callable and
      # unpromised, so this ratchets coverage rather than letting it slip.
      - name: Verify OpenAPI coverage
        run: make verify-openapi-coverage
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build testable release image
        run: >-
          docker buildx build
          --load
          --platform linux/amd64
          --file api/Dockerfile
          --tag merlon:release-dry-run
          --build-arg VERSION=ci-${{ github.sha }}
          --build-arg REVISION=${{ github.sha }}
          .
      - name: Verify release image runtime contract
        run: bash scripts/check-release-image.sh merlon:release-dry-run
      # The same platform list the release workflow publishes. Building only
      # the runner's own architecture here would leave linux/arm64 first
      # attempted on a tag push, where a failure cannot be corrected without
      # burning the version. Both builder stages are pinned to BUILDPLATFORM
      # and Go cross-compiles, so this needs no emulator.
      - name: Build release image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

  required:
    # Branch protection matches required status checks by check-run name, and a
    # check-run is named after its job. Every workflow that gates main needs a
    # distinct aggregate name, or the contexts collide and none can be required.
    name: CI Required
    if: ${{ always() }}
    needs: [go-test, scripts-test, ui-build, postgres-integration, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          GO_RESULT: ${{ needs.go-test.result }}
          SCRIPTS_RESULT: ${{ needs.scripts-test.result }}
          UI_RESULT: ${{ needs.ui-build.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          RELEASE_RESULT: ${{ needs.release-dry-run.result }}
        run: >-
          test "$GO_RESULT" = success
          -a "$SCRIPTS_RESULT" = success
          -a "$UI_RESULT" = success
          -a "$POSTGRES_RESULT" = success
          -a "$RELEASE_RESULT" = success
