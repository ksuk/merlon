name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'
      - run: make verify-go GO_TEST_FLAGS='-coverprofile=coverage.out -covermode=atomic'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: api/coverage.out

  ui-build:
    name: UI Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test -- --run --coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-coverage
          path: ui/coverage

  postgres-integration:
    name: PostgreSQL Migration & Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: merlon
          POSTGRES_USER: merlon
          POSTGRES_PASSWORD: merlon-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merlon -d merlon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MERLON_DATABASE_URL: postgres://merlon:merlon-ci@localhost:5432/merlon?sslmode=disable
      MERLON_MIGRATION_DATABASE_URL: postgres://merlon:merlon-ci@localhost:5432/merlon?sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'
      - run: make test-integration

  release-dry-run:
    name: Release Image Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify synchronized container pins
        run: make verify-container-pins
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          build-args: VERSION=ci-${{ github.sha }}

  required:
    # Branch protection matches required status checks by check-run name, and a
    # check-run is named after its job. Every workflow that gates main needs a
    # distinct aggregate name, or the contexts collide and none can be required.
    name: CI Required
    if: ${{ always() }}
    needs: [go-test, ui-build, postgres-integration, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          GO_RESULT: ${{ needs.go-test.result }}
          UI_RESULT: ${{ needs.ui-build.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          RELEASE_RESULT: ${{ needs.release-dry-run.result }}
        run: >-
          test "$GO_RESULT" = success
          -a "$UI_RESULT" = success
          -a "$POSTGRES_RESULT" = success
          -a "$RELEASE_RESULT" = success
