name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish Attested Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Verify protected release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be strict SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]]; then
            echo "Release tag must be annotated." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$release_commit" origin/main
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.0'

      # This step gates the release and must stay ahead of the image build:
      # once an image is pushed under the release tag it is public, and a
      # later failure cannot unpublish it. Everything that can reject the
      # release belongs above "Build and publish immutable image".
      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          # Release notes come from CHANGELOG.md rather than from commit
          # subjects: it makes the changelog load-bearing, so a release cannot
          # be cut without one and it cannot silently drift from what shipped.
          # scripts/changelog.mjs exits non-zero when the tag has no section.
          node scripts/changelog.mjs "$GITHUB_REF_NAME" > release-notes.md

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.release.outputs.image }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Attest image provenance
        id: attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false

      - name: Create release evidence manifest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE_URL: ${{ steps.attestation.outputs.attestation-url }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          sbom_sha256=$(sha256sum sbom-image.cdx.json | cut -d ' ' -f 1)
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$RELEASE_COMMIT" \
            --arg image "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            --arg provenance_url "$PROVENANCE_URL" \
            --arg sbom "sbom-image.cdx.json" \
            --arg sbom_sha256 "$sbom_sha256" \
            '{schema_version: 1, tag: $tag, commit: $commit, image: $image, image_digest: $digest, sbom: {file: $sbom, sha256: $sbom_sha256}, provenance: {provider: "GitHub artifact attestation", url: $provenance_url}}' \
            > release-manifest.json
          sha256sum release-manifest.json sbom-image.cdx.json > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-manifest.json sbom-image.cdx.json SHA256SUMS
          --verify-tag --notes-file release-notes.md --title "$GITHUB_REF_NAME"
