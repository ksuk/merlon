name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  # Read-only, and only so the release can verify the claim it publishes about
  # the gates that ran on the release commit. Declaring any permission sets
  # every unlisted one to none, so both have to be named.
  checks: read
  statuses: read

jobs:
  publish:
    name: Publish Attested Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify protected release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          # One channel: vMAJOR.MINOR.PATCH. Pre-release identifiers are
          # rejected rather than accepted-and-labelled, because this project
          # has no second channel to route them to. What a release does and
          # does not assert is published with the release itself (see the
          # governance block in release-manifest.json and the disclosure header
          # in the release notes) instead of being encoded in a tag suffix that
          # readers skip. See docs/development/release-checklist.md.
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "Release tag must be strict SemVer: vMAJOR.MINOR.PATCH" >&2
            echo "(got: $GITHUB_REF_NAME). Pre-release identifiers are not published." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]]; then
            echo "Release tag must be annotated." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$release_commit" origin/main
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'

      # The release notes assert that every automated gate passed on the
      # release commit. That is a checkable claim, so it is checked here rather
      # than asserted on trust — a release that says its gates passed while
      # they did not is worse than one that says nothing.
      #
      # Only the two aggregates that run on `push` to main are required. They
      # are named explicitly rather than "every check-run was successful",
      # because that form silently weakens to a tautology the moment a workflow
      # stops running, and it would also sweep in unrelated or advisory runs.
      # `Governance Required` is deliberately absent: it is posted against pull
      # request head commits, never against the merge commit a tag points at,
      # so requiring it here would deadlock every release permanently.
      #
      # A tag pushed before main's CI finishes fails this step. That is the
      # intended direction — the fix is to retag once the checks are green, not
      # to publish an image whose evidence does not exist yet.
      - name: Verify required checks passed on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          required=('CI Required' 'Security Required')

          # Both a check-run conclusion and a commit status count, for the same
          # reason the governance gate publishes a status: a ruleset accepts
          # either, so the release must accept either too. Both endpoints are
          # the "latest per name" form on purpose — check-runs defaults to
          # filter=latest, and /status is the combined view. The per-status
          # history endpoint would also return superseded entries, so a failure
          # that was already re-run green would read as a failure forever.
          conclusions=$(
            {
              gh api --paginate "repos/$REPO/commits/$RELEASE_COMMIT/check-runs" \
                --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "")"'
              gh api "repos/$REPO/commits/$RELEASE_COMMIT/status" \
                --jq '.statuses[] | "\(.context)\tcompleted\t\(.state)"'
            }
          )

          failed=0
          for context in "${required[@]}"; do
            verdict=$(awk -F'\t' -v c="$context" '$1 == c && $2 == "completed" { print $3 }' \
              <<<"$conclusions" | sort -u | paste -sd, -)
            if [[ -z "$verdict" ]]; then
              echo "::error::No completed '$context' run on $RELEASE_COMMIT." >&2
              failed=1
            elif [[ "$verdict" != "success" ]]; then
              echo "::error::'$context' on $RELEASE_COMMIT concluded: $verdict" >&2
              failed=1
            else
              echo "$context: success"
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "Refusing to publish a release that claims its gates passed." >&2
            exit 1
          fi

      # This step gates the release and must stay ahead of the image build:
      # once an image is pushed under the release tag it is public, and a
      # later failure cannot unpublish it. Everything that can reject the
      # release belongs above "Build and publish immutable image".
      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          # Release notes come from CHANGELOG.md rather than from commit
          # subjects: it makes the changelog load-bearing, so a release cannot
          # be cut without one and it cannot silently drift from what shipped.
          # The tag must have its own "## [X.Y.Z]" section; scripts/changelog.mjs
          # exits non-zero without one and never falls back to another section.
          node scripts/changelog.mjs "$GITHUB_REF_NAME" > changelog-section.md

          # Every release states what it does and does not assert, in the
          # release itself rather than only in the documentation. The same
          # facts are emitted machine-readably in release-manifest.json's
          # governance block and as an image label. This project has one
          # maintainer, so independent approval and separation of duties do not
          # exist here; saying so on the artifact is the honest form of that.
          #
          # Each sentence below is either verified above or is a disclosure —
          # ADR-0016's rule applied to the release's own wording. The gate claim
          # is verified by "Verify required checks passed on the release
          # commit". The self-review claim is *not* verified and is scoped
          # accordingly: `Governance Required` is posted against pull request
          # head commits, and a squash or merge commit on main is a different
          # SHA that never carries it, so the release cannot confirm from here
          # which of its pull requests had a record. Stating it as a scoped
          # disclosure is the only accurate form. Do not upgrade this to a
          # categorical claim without a mechanism that actually checks it.
          cat > release-notes.md <<'DISCLOSURE'
          > **How this release was produced.** The `CI Required` and
          > `Security Required` gates are verified to have passed on the release
          > commit before this release is published. Pull requests merged after
          > [ADR-0016](https://github.com/ksuk/merlon/blob/main/docs/decisions/0016-single-maintainer-change-control.md)
          > additionally carry a maintainer self-review record, enforced at merge
          > time by the `Governance Required` status; that record is on the pull
          > request, and this release does not re-verify it. This release does
          > **not** assert independent approval or separation of duties: the
          > project has one maintainer, and one person cannot review their own
          > work independently. The image carries a build provenance attestation,
          > a CycloneDX SBOM, and an immutable digest regardless.

          DISCLOSURE
          cat changelog-section.md >> release-notes.md

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.release.outputs.image }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ steps.release.outputs.commit }}

      - name: Attest image provenance
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false

      - name: Create release evidence manifest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE_URL: ${{ steps.attestation.outputs.attestation-url }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          sbom_sha256=$(sha256sum sbom-image.cdx.json | cut -d ' ' -f 1)
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$RELEASE_COMMIT" \
            --arg image "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            --arg provenance_url "$PROVENANCE_URL" \
            --arg sbom "sbom-image.cdx.json" \
            --arg sbom_sha256 "$sbom_sha256" \
            '{schema_version: 2, tag: $tag, commit: $commit, image: $image, image_digest: $digest, sbom: {file: $sbom, sha256: $sbom_sha256}, provenance: {provider: "GitHub artifact attestation", url: $provenance_url}, governance: {mode: "single-maintainer", independent_approval: false, separation_of_duties: false, adr: "ADR-0016"}}' \
            > release-manifest.json
          sha256sum release-manifest.json sbom-image.cdx.json > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-manifest.json sbom-image.cdx.json SHA256SUMS \
            --verify-tag --notes-file release-notes.md --title "$GITHUB_REF_NAME"
