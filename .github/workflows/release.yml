name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish Attested Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify protected release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be strict SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]]; then
            echo "Release tag must be annotated." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$release_commit" origin/main
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.release.outputs.image }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Attest image provenance
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false

      - name: Create release evidence manifest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROVENANCE_URL: ${{ steps.attestation.outputs.attestation-url }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          sbom_sha256=$(sha256sum sbom-image.cdx.json | cut -d ' ' -f 1)
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$RELEASE_COMMIT" \
            --arg image "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            --arg provenance_url "$PROVENANCE_URL" \
            --arg sbom "sbom-image.cdx.json" \
            --arg sbom_sha256 "$sbom_sha256" \
            '{schema_version: 1, tag: $tag, commit: $commit, image: $image, image_digest: $digest, sbom: {file: $sbom, sha256: $sbom_sha256}, provenance: {provider: "GitHub artifact attestation", url: $provenance_url}}' \
            > release-manifest.json
          sha256sum release-manifest.json sbom-image.cdx.json > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-manifest.json sbom-image.cdx.json SHA256SUMS
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
