name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 9:00 UTC

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'
      - run: go tool govulncheck ./...

  go-licenses:
    name: Go License Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.12'
      # go-licenses is installed on demand (not a module tool dependency) so its
      # transitive go-git chain never enters api/go.mod and never surfaces as a
      # Dependabot alert on the shipped module.
      - run: go install github.com/google/go-licenses@v1.6.0
      - run: go-licenses check ./... --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC --ignore github.com/ksuk/merlon

  npm-licenses:
    name: Node License Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run license:check

  npm-licenses-website:
    name: Website License Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # OFL-1.1 (Fontsource fonts) and MPL-1.1 (lunr-languages, unmodified)
      # are attributed in NOTICE. CC-BY-4.0 is caniuse-lite build-time data.
      - run: npm run license:check

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - run: npm ci
      - run: npm audit --audit-level=high

  sbom:
    name: CycloneDX SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./api
          format: cyclonedx-json
          output-file: sbom-api.cdx.json
          artifact-name: sbom-api
      - name: Generate UI SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./ui
          format: cyclonedx-json
          output-file: sbom-ui.cdx.json
          artifact-name: sbom-ui
      - name: Generate website SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./website
          format: cyclonedx-json
          output-file: sbom-website.cdx.json
          artifact-name: sbom-website

  required:
    name: Required
    if: ${{ always() }}
    needs: [gitleaks, govulncheck, go-licenses, npm-licenses, npm-licenses-website, npm-audit, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Require every security job
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          GOVULN_RESULT: ${{ needs.govulncheck.result }}
          GO_LICENSE_RESULT: ${{ needs.go-licenses.result }}
          UI_LICENSE_RESULT: ${{ needs.npm-licenses.result }}
          WEBSITE_LICENSE_RESULT: ${{ needs.npm-licenses-website.result }}
          NPM_AUDIT_RESULT: ${{ needs.npm-audit.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          for result in "$GITLEAKS_RESULT" "$GOVULN_RESULT" "$GO_LICENSE_RESULT" "$UI_LICENSE_RESULT" "$WEBSITE_LICENSE_RESULT" "$NPM_AUDIT_RESULT"; do
            test "$result" = success
          done
          case "$SBOM_RESULT" in
            success|skipped) ;;
            *) echo "sbom job failed or cancelled: $SBOM_RESULT" >&2; exit 1 ;;
          esac
