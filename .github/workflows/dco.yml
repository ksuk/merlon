name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-signoffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
      - name: Verify DCO sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # pull_request checkouts use a synthetic merge commit. Only inspect
          # commits authored by the contributor branch itself.
          for commit in $(git rev-list --no-merges "$BASE_SHA..HEAD"); do
            # Bot-authored commits (Dependabot, GitHub Actions, ...) carry no
            # DCO sign-off; the DCO covers human contributions only.
            author_email=$(git log -1 --format=%ae "$commit")
            case "$author_email" in
              *"[bot]@users.noreply.github.com")
                echo "Skipping bot commit: $commit ($author_email)"
                continue
                ;;
            esac
            if ! git log -1 --format=%B "$commit" | grep -qi '^Signed-off-by: .'; then
              echo "Missing DCO sign-off: $commit" >&2
              exit 1
            fi
          done
