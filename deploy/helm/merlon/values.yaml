# Default values for the Merlon Helm chart.
# This is a minimal configuration. Override per environment.

# -- Global settings applied across components.
global:
  imageRegistry: ""
  imagePullSecrets: []

# -- Merlon API. This single image also serves the operator UI, so there is no
#    separate UI deployment; see docs/operations/container-images.md.
#
#    tag is intentionally empty. Set it to a released version explicitly, or
#    better, pin a digest. A default here would be a version claim this chart
#    cannot keep current.
api:
  image:
    repository: ghcr.io/ksuk/merlon
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    MERLON_ENV: production
    MERLON_LOG_LEVEL: info
    MERLON_AUTH_ENABLED: "true"

# -- PostgreSQL. For production, prefer a managed instance and set
#    postgresql.enabled=false with external connection details.
postgresql:
  enabled: true
  auth:
    username: merlon
    password: ""        # set via secret; do not commit
    database: merlon
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

# -- Redis (optional cache).
redis:
  enabled: false
  auth:
    password: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# -- Ingress (disabled by default; configure for external access).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
