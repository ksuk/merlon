[package]
name = "merlon-engine"
version = "0.1.0"
edition = "2024"
description = "Merlon AML/CFT rule evaluation engine"
license = "BSL-1.1"

[[bin]]
name = "merlon-engine"
path = "src/main.rs"

[lib]
name = "merlon_engine"
path = "src/lib.rs"

[dependencies]
tonic = "0.13"
tonic-health = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio-stream = "0.1"
prometheus = { version = "0.14.0", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
http = "1.4.2"
http-body-util = "0.1.3"
bytes = "1.12.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

[build-dependencies]
tonic-build = "0.13"
