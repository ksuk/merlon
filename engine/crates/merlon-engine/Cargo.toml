[package]
name = "merlon-engine"
version = "0.1.0"
edition = "2024"
description = "Merlon AML/CFT rule evaluation engine"
license = "BSL-1.1"

[[bin]]
name = "merlon-engine"
path = "src/main.rs"

[lib]
name = "merlon_engine"
path = "src/lib.rs"

[dependencies]
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.13"
