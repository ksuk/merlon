schema_version: "2.0"
scenario_id: tm_structuring_v2
name: Structuring Detection v2
description: 同一顧客による一定期間内の分割取引を検知（v2スキーマ、顧客種別分岐版）
type: aggregation
conditions:
  transaction_type: [deposit, transfer_in]
  aggregation:
    field: amount
    function: sum
    period: 24h
    group_by: customer_id
  threshold:
    by_customer_type:
      individual:
        by_risk_tier:
          LOW: 5000000
          MEDIUM: 3000000
          HIGH: 1000000
      corporate_domestic:
        by_risk_tier:
          LOW: 20000000
          MEDIUM: 15000000
          HIGH: 5000000
      corporate_foreign:
        by_risk_tier:
          LOW: 15000000
          MEDIUM: 10000000
          HIGH: 3000000
  additional:
    min_transaction_count: 3
severity: HIGH
